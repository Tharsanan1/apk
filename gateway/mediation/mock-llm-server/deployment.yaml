apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-json-responder
  labels:
    app: flask-json-responder
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flask-json-responder
  template:
    metadata:
      labels:
        app: flask-json-responder
    spec:
      containers:
        - name: flask-json-responder
          image: flask-json-responder:latest
          imagePullPolicy: Never  # Use 'IfNotPresent' if pushed to registry
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: flask-json-service
spec:
  selector:
    app: flask-json-responder
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
  type: ClusterIP  # Use LoadBalancer if exposing externally in cloud
